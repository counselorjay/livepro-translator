<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Translator PRO - Counselor Jay</title>
<style>
  body { 
    background-color: #121212; 
    color: #ffffff; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: flex-start; 
    min-height: 100vh; 
    margin: 0; 
    padding: 6vh 40px; 
    box-sizing: border-box; 
  }
  #main-wrapper {
    max-width: 90%;
    width: 1400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .controls-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 4px;
  }
  #lang-select {
    padding: 4px 8px;
    font-size: 0.5rem;
    background-color: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 12px;
    cursor: pointer;
    outline: none;
    appearance: none;
    text-align: center;
  }
  #lang-select:hover {
    border-color: #4facfe;
  }
  #live-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 2vh;
    border-bottom: 1px solid #222;
    padding-bottom: 3px;
    margin-bottom: 6px;
  }
  #english-text { 
    font-size: 0.4vw; 
    color: #444444; 
    text-align: center; 
    min-height: 0.5vw; 
    font-weight: 400;
  }
  #translated-text { 
    font-size: 0.5vw; 
    font-weight: 400; 
    text-align: center; 
    color: #555555; 
    min-height: 0.6vw; 
    line-height: 1.2;
    margin-top: 1px;
  }
  #history-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }
  .history-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0.55;
    transition: opacity 0.3s;
  }
  .history-item:hover {
    opacity: 0.9;
  }
  .history-en { 
    font-size: 2vw; 
    color: #aaaaaa; 
  }
  .history-tl { 
    font-size: 4vw; 
    color: #4facfe; 
    font-weight: 700; 
  }
  button { 
    padding: 4px 10px; 
    font-size: 0.45rem; 
    background-color: #222; 
    color: white; 
    border: 1px solid #444; 
    border-radius: 12px; 
    cursor: pointer; 
    transition: all 0.3s ease; 
  }
  button:hover { 
    background-color: #4facfe; 
    border-color: #4facfe;
  }
  .recording { 
    animation: pulse 1.5s infinite; 
    background-color: #ff4757 !important; 
    border-color: #ff4757 !important;
  }
  @keyframes pulse { 
    0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 
    70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); } 
    100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } 
  }
  .branding {
    position: fixed;
    bottom: 20px;
    font-size: 1rem;
    color: #444;
  }
</style>
</head>
<body>

<div id="main-wrapper">
  <div id="live-container">
    <div id="english-text">Waiting for speech...</div>
    <div id="translated-text">대기 중...</div>
    <div class="controls-row">
      <select id="lang-select">
        <option value="KO">Korean (한국어)</option>
        <option value="ZH">Chinese (中文)</option>
        <option value="JA">Japanese (日本語)</option>
        <option value="ES">Spanish (Español)</option>
        <option value="FR">French (Français)</option>
        <option value="DE">German (Deutsch)</option>
        <option value="PT">Portuguese (Português)</option>
        <option value="IT">Italian (Italiano)</option>
        <option value="RU">Russian (Русский)</option>
        <option value="VI">Vietnamese (Tiếng Việt)</option>
        <option value="TH">Thai (ไทย)</option>
        <option value="ID">Indonesian (Bahasa Indonesia)</option>
      </select>
      <button id="start-btn">Start Microphone</button>
    </div>
  </div>
  
  <div id="history-container">
    <!-- Past translations will appear here -->
  </div>
</div>

<div class="branding">prolive.counselorjay.com</div>

<script>
  const englishDiv = document.getElementById('english-text');
  const translatedDiv = document.getElementById('translated-text');
  const startBtn = document.getElementById('start-btn');
  const langSelect = document.getElementById('lang-select');
  const historyDiv = document.getElementById('history-container');

  let recognizing = false;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  // DeepL API key - set this or prompt user
  let DEEPL_API_KEY = '396be426-67fa-4a7a-bad6-78034d72b851:fx';
  
  // API key hardcoded

  if (!SpeechRecognition) {
    translatedDiv.innerText = "Error: Please open this in Google Chrome.";
    startBtn.style.display = 'none';
  }

  const recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  // DeepL language code mapping
  const deeplLangMap = {
    'KO': 'KO', 'ZH': 'ZH', 'JA': 'JA', 'ES': 'ES', 'FR': 'FR',
    'DE': 'DE', 'PT': 'PT-PT', 'IT': 'IT', 'RU': 'RU', 'VI': 'VI',
    'TH': 'TH', 'ID': 'ID'
  };

  const waitingTexts = {
    'KO': '대기 중...', 'ZH': '等待中...', 'JA': 'お待ちください...',
    'ES': 'Esperando...', 'FR': 'En attente...', 'DE': 'Warten...',
    'PT': 'Aguardando...', 'IT': 'In attesa...', 'RU': 'Ожидание...',
    'VI': 'Đang chờ...', 'TH': 'กำลังรอ...', 'ID': 'Menunggu...'
  };

  async function translateText(text) {
    if (!text.trim()) return "";
    
    const targetLang = langSelect.value;
    const targetCode = deeplLangMap[targetLang] || targetLang;
    
    // Use CORS proxy to bypass browser restrictions
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(
      'https://api-free.deepl.com/v2/translate'
    );
    
    try {
      const response = await fetch(proxyUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Authorization': 'DeepL-Auth-Key 396be426-67fa-4a7a-bad6-78034d72b851:fx'
        },
        body: `text=${encodeURIComponent(text)}&source_lang=EN&target_lang=${targetCode}`
      });
      
      const data = await response.json();
      if (data.translations && data.translations.length > 0) {
        return data.translations[0].text;
      }
      return "Translation error.";
    } catch (e) {
      console.error(e);
      return "API Error: " + e.message;
    }
  }

  let translationTimeout;
  let historyLines = [];

  function renderHistory() {
    historyDiv.innerHTML = "";
    const displayList = [...historyLines].reverse();
    displayList.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `<div class="history-en">${item.en}</div><div class="history-tl">${item.tl}</div>`;
      historyDiv.appendChild(div);
    });
  }

  async function processFinal(text) {
    if (!text.trim()) return;
    const translated = await translateText(text);
    historyLines.push({ en: text, tl: translated });
    if (historyLines.length > 4) historyLines.shift();
    renderHistory();
  }

  langSelect.addEventListener('change', () => {
    historyLines = [];
    renderHistory();
    if (!recognizing) {
      translatedDiv.innerText = waitingTexts[langSelect.value] || 'Waiting...';
    }
  });

  recognition.onresult = (event) => {
    let interim = '';

    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        processFinal(event.results[i][0].transcript);
      } else {
        interim += event.results[i][0].transcript;
      }
    }

    englishDiv.innerText = interim || (recognizing ? "..." : "Waiting for speech...");
    
    clearTimeout(translationTimeout);
    if (interim.trim().length > 0) {
      translationTimeout = setTimeout(async () => {
        const translated = await translateText(interim);
        translatedDiv.innerText = translated;
      }, 400);
    } else {
      translatedDiv.innerText = recognizing ? "" : (waitingTexts[langSelect.value] || 'Waiting...');
    }
  };

  recognition.onend = () => {
    if (recognizing) {
      try {
        recognition.start();
      } catch(e) {}
    }
  };

  startBtn.addEventListener('click', () => {
    if (recognizing) {
      recognition.stop();
      recognizing = false;
      startBtn.innerText = "Start Microphone";
      startBtn.classList.remove("recording");
      englishDiv.innerText = "Waiting for speech...";
      translatedDiv.innerText = waitingTexts[langSelect.value] || 'Waiting...';
    } else {
      recognition.start();
      recognizing = true;
      startBtn.innerText = "Stop Microphone";
      startBtn.classList.add("recording");
      englishDiv.innerText = "Listening...";
      translatedDiv.innerText = "";
    }
  });
</script>
</body>
</html>
