<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Translator PRO - Counselor Jay</title>
<style>
  body { 
    background-color: #121212; 
    color: #ffffff; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: flex-start; 
    min-height: 100vh; 
    margin: 0; 
    padding: 6vh 40px; 
    box-sizing: border-box; 
  }
  #main-wrapper {
    max-width: 90%;
    width: 1400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .controls-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 4px;
  }
  #lang-select {
    padding: 4px 8px;
    font-size: 0.5rem;
    background-color: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 12px;
    cursor: pointer;
    outline: none;
    appearance: none;
    text-align: center;
  }
  #lang-select:hover {
    border-color: #4facfe;
  }
  #live-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 2vh;
    border-bottom: 1px solid #222;
    padding-bottom: 3px;
    margin-bottom: 6px;
  }
  #english-text { 
    font-size: 0.4vw; 
    color: #444444; 
    text-align: center; 
    min-height: 0.5vw; 
    font-weight: 400;
  }
  #translated-text { 
    font-size: 0.5vw; 
    font-weight: 400; 
    text-align: center; 
    color: #555555; 
    min-height: 0.6vw; 
    line-height: 1.2;
    margin-top: 1px;
  }
  #history-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }
  .history-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0.55;
    transition: opacity 0.3s;
  }
  .history-item:hover {
    opacity: 0.9;
  }
  .history-en { 
    font-size: 2vw; 
    color: #aaaaaa; 
  }
  .history-tl { 
    font-size: 4vw; 
    color: #4facfe; 
    font-weight: 700; 
  }
  button { 
    padding: 4px 10px; 
    font-size: 0.45rem; 
    background-color: #222; 
    color: white; 
    border: 1px solid #444; 
    border-radius: 12px; 
    cursor: pointer; 
    transition: all 0.3s ease; 
  }
  button:hover { 
    background-color: #4facfe; 
    border-color: #4facfe;
  }
  .recording { 
    animation: pulse 1.5s infinite; 
    background-color: #ff4757 !important; 
    border-color: #ff4757 !important;
  }
  @keyframes pulse { 
    0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 
    70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); } 
    100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } 
  }
  .branding {
    position: fixed;
    bottom: 20px;
    font-size: 1rem;
    color: #444;
  }
</style>
</head>
<body>

<div id="main-wrapper">
  <div id="live-container">
    <div id="english-text">Waiting for speech...</div>
    <div id="translated-text">대기 중...</div>
    <div class="controls-row">
      <select id="lang-select">
        <option value="ko">Korean (한국어)</option>
        <option value="zh-CN">Chinese Simplified (简体中文)</option>
        <option value="zh-TW">Chinese Traditional (繁體中文)</option>
        <option value="ja">Japanese (日本語)</option>
        <option value="es">Spanish (Español)</option>
        <option value="fr">French (Français)</option>
        <option value="de">German (Deutsch)</option>
        <option value="pt">Portuguese (Português)</option>
        <option value="it">Italian (Italiano)</option>
        <option value="ru">Russian (Русский)</option>
        <option value="vi">Vietnamese (Tiếng Việt)</option>
        <option value="th">Thai (ไทย)</option>
        <option value="id">Indonesian (Bahasa Indonesia)</option>
        <option value="ar">Arabic (العربية)</option>
        <option value="hi">Hindi (हिन्दी)</option>
      </select>
      <button id="start-btn">Start Microphone</button>
    </div>
  </div>
  
  <div id="history-container">
    <!-- Past translations will appear here -->
  </div>
</div>

<div class="branding">prolive.counselorjay.com</div>

<script>
  const englishDiv = document.getElementById('english-text');
  const translatedDiv = document.getElementById('translated-text');
  const startBtn = document.getElementById('start-btn');
  const langSelect = document.getElementById('lang-select');
  const historyDiv = document.getElementById('history-container');

  let recognizing = false;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  // --- Configuration ---
  const MODES = {
    FAST: { silenceMs: 2000, maxChunkMs: 5000 },
    BALANCED: { silenceMs: 4000, maxChunkMs: 7000 },
    ACCURATE: { silenceMs: 6000, maxChunkMs: 10000 }
  };

  const CURRENT_MODE = MODES.BALANCED;

  // --- Timers ---
  let silenceTimer;
  let maxChunkTimer;
  let pendingChunk = "";

  const waitingTexts = {
    'ko': '대기 중...', 'zh-CN': '等待中...', 'zh-TW': '等待中...', 'ja': 'お待ちください...',
    'es': 'Esperando...', 'fr': 'En attente...', 'de': 'Warten...',
    'pt': 'Aguardando...', 'it': 'In attesa...', 'ru': 'Ожидание...',
    'vi': 'Đang chờ...', 'th': 'กำลังรอ...', 'id': 'Menunggu...',
    'ar': 'في انتظار...', 'hi': 'प्रतीक्षा...'
  };

  if (!SpeechRecognition) {
    translatedDiv.innerText = "Error: Please open this in Google Chrome.";
    startBtn.style.display = 'none';
  }

  const recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false; // IMPORTANT: Disable interim results for translation
  recognition.lang = 'en-US';

  // --- Translation and Chunking Logic ---
  async function translateText(text) {
    if (!text.trim()) return "";
    const targetLang = langSelect.value;
    const targetCode = targetLang.toUpperCase();
    try {
      // Using DeepL API via Cloudflare Worker proxy
      const response = await fetch('https://api.counselorjay.com/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, target_lang: targetCode })
      });
      const data = await response.json();
      if (data.translations && data.translations.length > 0) {
        return data.translations[0].text;
      }
      return "Translation error.";
    } catch (e) {
      console.error(e);
      return "Translation error: " + e.message;
    }
  }

  function finalizeChunk() {
    if (!pendingChunk.trim() || pendingChunk.trim() === englishDiv.innerText) {
      // Ignore empty or duplicate chunks
      return;
    }

    translateText(pendingChunk).then(translated => {
      // Show current translation in real-time
      translatedDiv.innerText = translated;
      // Also add to history
      historyLines.push({ en: pendingChunk.trim(), tl: translated });
      if (historyLines.length > 4) historyLines.shift(); // Maintain max history
      renderHistory();
    });

    // Reset timers and buffer
    clearTimeout(silenceTimer);
    clearTimeout(maxChunkTimer);
    pendingChunk = "";
    englishDiv.innerText = "Waiting for speech..."; // Reset live listening text
  }

  function resetTimers() {
    clearTimeout(silenceTimer);
    clearTimeout(maxChunkTimer);
    if (recognizing) {
        silenceTimer = setTimeout(finalizeChunk, CURRENT_MODE.silenceMs);
        maxChunkTimer = setTimeout(finalizeChunk, CURRENT_MODE.maxChunkMs);
    }
  }

  let historyLines = [];

  function renderHistory() {
    historyDiv.innerHTML = "";
    const displayList = [...historyLines].reverse();
    displayList.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `<div class="history-en">${item.en}</div><div class="history-tl">${item.tl}</div>`;
      historyDiv.appendChild(div);
    });
  }

  // Process finalized speech
  function processFinal(text) {
      if (!text.trim()) return;
      pendingChunk += " " + text.trim(); // Append to chunk

      // Update live English transcript
      englishDiv.innerText = pendingChunk.trim();

      // Reset timers for new speech
      resetTimers();
  }


  langSelect.addEventListener('change', () => {
    historyLines = []; // Clear history on language change
    renderHistory();
    if (!recognizing) {
      translatedDiv.innerText = waitingTexts[langSelect.value] || 'Waiting...';
    }
  });

  recognition.onresult = (event) => {
    let interim = '';

    for (let i = event.resultIndex; i < event.results.length; ++i) {
      // ONLY process final results for translation
      if (event.results[i].isFinal) {
        processFinal(event.results[i][0].transcript);
      } else {
        // Show interim text as "live listening"
        interim += event.results[i][0].transcript;
      }
    }
    
    // Update live English transcript with interim text
    if (interim.trim().length > 0) {
        englishDiv.innerText = pendingChunk.trim() + " " + interim.trim();
    }

    // Don't trigger translation on interim results, but reset timers
    resetTimers();
  };

  recognition.onend = () => {
    // If recognizing was true, it means the user stopped speaking or there was an error.
    // Start again if recognizing is still true, but handle potential errors.
    if (recognizing) {
      silenceTimer = setTimeout(finalizeChunk, CURRENT_MODE.silenceMs); // Finalize any remaining chunk on stop
      try {
        recognition.start(); // Attempt to restart
      } catch(e) {
        console.error("Error restarting recognition:", e);
        // Handle error, maybe show a message to the user
      }
    }
  };

  startBtn.addEventListener('click', () => {
    if (recognizing) {
      // Stop the process
      recognition.stop();
      recognizing = false;
      startBtn.innerText = "Start Microphone";
      startBtn.classList.remove("recording");
      
      // Finalize any remaining chunk when stopping
      finalizeChunk();
      
      englishDiv.innerText = "Waiting for speech...";
      translatedDiv.innerText = waitingTexts[langSelect.value] || 'Waiting...';
      
    } else {
      // Start the process
      recognition.start();
      recognizing = true;
      startBtn.innerText = "Stop Microphone";
      startBtn.classList.add("recording");
      
      // Reset state and timers
      pendingChunk = "";
      historyLines = [];
      renderHistory(); // Clear history display
      englishDiv.innerText = "Listening...";
      translatedDiv.innerText = ""; // Clear previous translation prompt
      
      resetTimers(); // Start the timers
    }
  });

  // Initial setup for language selector
  langSelect.addEventListener('change', () => {
    historyLines = []; // Clear history on language change
    renderHistory();
    if (!recognizing) {
      translatedDiv.innerText = waitingTexts[langSelect.value] || 'Waiting...';
    }
  });

  // Initialize history and language selector
  renderHistory();
  translatedDiv.innerText = waitingTexts[langSelect.value] || 'Waiting...';

</script>
</body>
</html>
