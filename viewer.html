<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Translation Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0f;
      --text: #f0f0f0;
      --accent: #00c896;
      --muted: #666;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px;
    }
    
    h1 {
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 30px;
      font-weight: 400;
    }
    
    .translations {
      display: flex;
      flex-direction: column;
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .translation-line {
      font-size: 2rem;
      line-height: 1.4;
      font-weight: 500;
      color: var(--text);
    }
    
    .translation-line.placeholder {
      color: var(--muted);
      font-weight: 400;
      font-size: 1.5rem;
    }
    
    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 1.5rem;
    }
    
    .status {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 0.8rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>Live Translation</h1>
  
  <div id="translations" class="translations">
    <div class="empty">Waiting for translation...</div>
  </div>
  
  <div class="status">● Live</div>

  <script>
    const container = document.getElementById('translations');
    let history = [];
    const maxHistory = 8;
    
    function render() {
      if (history.length === 0) {
        container.innerHTML = '<div class="empty">Waiting for translation...</div>';
        return;
      }
      
      container.innerHTML = history.map(t => 
        `<div class="translation-line">${t}</div>`
      ).join('');
    }
    
    function checkTranslation() {
      try {
        const trans = localStorage.getItem('currentTranslation');
        if (trans && trans !== history[history.length - 1]) {
          history.push(trans);
          if (history.length > maxHistory) history.shift();
          render();
        }
      } catch(e) {}
      setTimeout(checkTranslation, 500);
    }
    
    checkTranslation();
  </script>
</body>
</html>
