<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Translation Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0f;
      --text: #f0f0f0;
      --accent: #00c896;
      --muted: #666;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    
    .container {
      max-width: 1200px;
      width: 100%;
      text-align: center;
    }
    
    h1 {
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 40px;
      font-weight: 400;
    }
    
    .translation {
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.3;
      font-weight: 600;
      color: var(--text);
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .translation.placeholder {
      color: var(--muted);
      font-weight: 400;
      font-size: 2rem;
    }
    
    .status {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 0.8rem;
      color: var(--accent);
      opacity: 0.8;
    }
    
    .waiting {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Live Translation</h1>
    <div id="translation" class="translation placeholder">Waiting for translation...</div>
  </div>
  
  <div class="waiting">Auto-sync from livepro.counselorjay.com</div>
  <div class="status">● Live</div>

  <script>
    const translationEl = document.getElementById('translation');
    
    function checkTranslation() {
      try {
        const trans = localStorage.getItem('currentTranslation');
        
        if (trans) {
          translationEl.textContent = trans;
          translationEl.classList.remove('placeholder');
        }
      } catch(e) {
        // LocalStorage not accessible
      }
      setTimeout(checkTranslation, 500);
    }
    
    checkTranslation();
  </script>
</body>
</html>
